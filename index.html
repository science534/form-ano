<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pendaftaran Astronomy Night Orion</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: url("https://images.unsplash.com/photo-1446776811953-b23d57bd21aa") no-repeat center center/cover;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    background: rgba(0, 0, 0, 0.8);
    padding: 30px;
    width: 90%;
    max-width: 400px;
    border-radius: 15px;
    color: white;
    box-shadow: 0 0 20px rgba(0,0,0,0.7);
}

h1 {
    text-align: center;
    margin-bottom: 20px;
}

input, select, textarea {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border-radius: 8px;
    border: none;
    outline: none;
}

button {
    width: 100%;
    padding: 12px;
    background: #6c63ff;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #5848d6;
}
</style>
</head>

<body>

<div class="container">
    <h1>Pendaftaran Astronomy Night Orion</h1>

    <input type="text" id="nama" placeholder="Nama">
    <input type="number" id="umur" placeholder="Umur">
    <input type="text" id="tiktok" placeholder="Akun TikTok">
    
    <select id="status">
        <option value="">Pilih Status</option>
        <option>Mahasiswa</option>
        <option>Pelajar</option>
        <option>Umum</option>
    </select>

    <textarea id="alasan" rows="3" placeholder="Alasan Masuk ANO"></textarea>

    <button onclick="kirimWA()">Daftar Sekarang</button>
</div>

<script>
function kirimWA() {
    let nama = document.getElementById("nama").value;
    let umur = document.getElementById("umur").value;
    let tiktok = document.getElementById("tiktok").value;
    let status = document.getElementById("status").value;
    let alasan = document.getElementById("alasan").value;

    let pesan = `Pendaftaran Astronomy Night Orion%0A
Nama: ${nama}%0A
Umur: ${umur}%0A
Akun TikTok: ${tiktok}%0A
Status: ${status}%0A
Alasan: ${alasan}`;

    let nomor = "6282150800880";

    window.open(`https://wa.me/${nomor}?text=${pesan}`, "_blank");
}
</script>

</body>
</html>
